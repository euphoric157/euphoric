<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EUPHORIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
    :root { --bg: {{ site_settings.bg_color }}; --accent: {{ site_settings.accent_color }}; }
    body { background-color: var(--bg) !important; }
    .hero { background-image: url('/static/uploads/{{ site_settings.banner_image }}'); background-size: cover; background-position: center; padding: 120px 20px; position: relative; }
    .hero::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10,10,10,0.6); }
    .hero h2, .hero p { position: relative; z-index: 2; }
    
    /* Стили для мобильной версии: 2 товара в ряд */
    @media (max-width: 768px) {
        .products { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; padding: 0 10px 40px !important; }
        .card .img { height: 180px !important; }
        .card h3 { font-size: 1rem !important; padding: 10px 5px 0 !important; }
        .card .price { font-size: 1rem !important; padding: 0 5px 10px !important; }
        .card .buy { font-size: 0.6rem !important; padding: 8px !important; }
        .hero { padding: 80px 15px !important; }
        .hero h2 { font-size: 2rem !important; }
        .filters button { font-size: 0.7rem !important; padding: 8px 12px !important; }
        nav a { font-size: 0.7rem !important; margin: 5px !important; }
        header { flex-direction: column; padding: 15px !important; }
    }
</style>
</head>
<body>

<header>
    <h1 style="color: var(--accent);">EUPHORIC</h1>
    <nav>
        <a href="/">Каталог</a> 
        <a href="#" onclick="showFavorites()" style="color:#e74c3c;">Избранное (♥)</a>
        <a href="/reviews">Отзывы</a>
        <a href="/workshops">Мастер-классы</a>
        <a href="#" onclick="openCart()" style="color: var(--accent);">Корзина (<span id="cart-count">0</span>)</a>
    </nav>
</header>

<section class="hero">
    <h2>{{ site_settings.site_title }}</h2>
    <p>Сумки · Шкатулки · Топы · Игрушки 🎄</p>
</section>

<div class="search-bar"><input type="text" id="search-input" placeholder="Поиск..." onkeyup="searchProducts()"></div>

<section class="filters">
  <button onclick="filter('all', event)" class="active">Все</button>
  <button onclick="filter('bags', event)">Сумки</button>
  <button onclick="filter('boxes', event)">Шкатулки</button>
  <button onclick="filter('tops', event)">Топы</button>
  <button onclick="filter('accessories', event)">Другие аксессуары</button>
  <button onclick="filter('toys', event)">Новогодние игрушки 🎄</button>
  <button onclick="filter('new', event)" style="color:var(--accent);">🔥 Новинки</button>
  <button onclick="filter('popular', event)" style="color:var(--accent);">⭐ Популярные</button>
</section>

<section class="products" id="products-grid">
{% for p in products %}
  <div class="card" data-cat="{{ p['category'] }}" data-title="{{ p['title']|lower }}" data-id="{{ p['id'] }}" data-sales="{{ p['sales'] }}">
    <span class="fav-icon" onclick="toggleFav(event, {{ p['id'] }})">♥</span>
    <a href="/product/{{ p['id'] }}" style="text-decoration:none; color:inherit;">
      <div class="img">{% if p['image'] %}<img src="/static/uploads/{{ p['image'] }}" alt="{{ p['title'] }}">{% else %}<span style="color: var(--accent);">✦</span>{% endif %}</div>
      <h3>{{ p['title'] }}</h3>
      <div class="price">{{ p['price'] }} ₽</div>
    </a>
    <div style="padding: 0 10px 15px; text-align: center;">
        <button class="buy" style="width: 100%; font-size: 0.7rem;" onclick="addToCart({{ p['id'] }}, '{{ p['title'] }}', {{ p['price'] }})">В корзину</button>
    </div>
  </div>
{% endfor %}
</section>

<!-- Модалка корзины (оставь как было) -->
<div id="cart-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center;">
    <div style="background:#111; border: 1px solid var(--accent); padding: 30px; max-width: 500px; width: 90%; position: relative;">
        <span onclick="closeCart()" style="position:absolute; top:15px; right:20px; color:var(--accent); font-size:24px; cursor:pointer;">×</span>
        <h2 style="color:#e8dcc8; margin-bottom:20px;">Ваша корзина</h2>
        <div id="cart-items" style="margin-bottom: 30px; color: #ccc; max-height: 300px; overflow-y: auto;"></div>
        <button class="buy" style="width:100%;" onclick="checkout()">Оформить заказ</button>
    </div>
</div>

<script>
// ВСТАВЬ СЮДА СКРИПТЫ (поиск, фильтры, корзина) ИЗ ПРЕДЫДУЩЕГО СООБЩЕНИЯ
</script>
</body>
</html>
