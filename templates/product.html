<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ p['title'] }} — EUPHORIC</title>
<link rel="stylesheet" href="/static/style.css">
<style>
    :root { --bg: {{ site_settings.bg_color }}; --accent: {{ site_settings.accent_color }}; }
    body { background-color: var(--bg) !important; }
    .product-gallery { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .product-gallery img { height: 400px; border-radius: 8px; object-fit: cover; }
</style>
</head>
<body>
<header>
    <h1><a href="/" style="color:var(--accent); text-decoration:none;">EUPHORIC</a></h1>
</header>

<main class="product-page">
  <div>
      <div class="product-gallery">
        {% for img in images %}
            {% if img %}
                <img src="/static/uploads/{{ img }}" alt="{{ p['title'] }}">
            {% endif %}
        {% endfor %}
      </div>
  </div>
  
  <div class="info">
    <h2>{{ p['title'] }}</h2>
    <div class="price">{{ p['price'] }} ₽</div>
    <p>{{ p['description'] }}</p>
    
    <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 30px;">
        <button class="buy" onclick="addToCart({{ p['id'] }}, '{{ p['title'] }}', {{ p['price'] }})">В корзину</button>
        <a class="buy" style="background: var(--accent); color: #0a0a0a;" href="https://t.me/{{ bot }}?start=buy_{{ p['id'] }}" target="_blank">Купить сейчас</a>
    </div>
  </div>
</main>

<script>
// Скрипт для корзины (как в index.html)
</script>
</body>
</html>
