<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ p['title'] }} — EUPHORIC</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
    <h1><a href="/" style="color:inherit;text-decoration:none;">EUPHORIC</a></h1>
</header>
<main class="product-page">
  <div class="img">
    {% if p['image'] %}<img src="/static/uploads/{{ p['image'] }}" alt="{{ p['title'] }}">{% else %}<span style="color: #c9a96e;">✦</span>{% endif %}
  </div>
  <div class="info">
    <h2>{{ p['title'] }}</h2>
    <div class="price">{{ p['price'] }} ₽</div>
    <p>{{ p['description'] }}</p>
    <div style="display:flex; gap:15px; flex-wrap:wrap;">
        <button class="buy" onclick="addToCart({{ p['id'] }}, '{{ p['title'] }}', {{ p['price'] }})">В корзину</button>
        <a class="buy" style="background: #c9a96e; color: #0a0a0a;" href="https://t.me/{{ bot }}?start=buy_{{ p['id'] }}_{{ p['title']|urlencode }}_{{ p['price'] }}" target="_blank">Купить сейчас</a>
    </div>
  </div>
</main>
<script>
function addToCart(id, title, price) {
    let cart = JSON.parse(localStorage.getItem('euphoric_cart')) || [];
    if (!cart.find(item => item.id === id)) {
        cart.push({ id: id, title: title, price: price });
        localStorage.setItem('euphoric_cart', JSON.stringify(cart));
        alert('Товар добавлен в корзину!');
    } else { alert('Этот товар уже в корзине'); }
}
</script>
</body>
</html>
