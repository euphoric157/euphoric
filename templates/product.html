<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ p['title'] }} — EUPHORIC</title>
<link rel="stylesheet" href="/static/style.css"></head><body>
<header><h1><a href="/" style="color:inherit;text-decoration:none;">EUPHORIC</a></h1></header>
<main class="product-page">
  <div class="img">{% if p['image'] %}<img src="/static/uploads/{{ p['image'] }}">{% else %}👜{% endif %}</div>
  <div class="info">
    <h2>{{ p['title'] }}</h2>
    <div class="price">{{ p['price'] }} ₽</div>
    <p>{{ p['description'] }}</p>
    <a class="buy" href="https://t.me/{{ bot }}?start=buy_{{ p['id'] }}" target="_blank">Купить в Telegram</a>
  </div>
</main>
</body></html>
