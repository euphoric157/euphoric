<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мастер-классы — EUPHORIC</title>
<link rel="stylesheet" href="/static/style.css">
<style> body { background-color: {{ site_settings.bg_color }} !important; } </style>
</head>
<body>
<header><h1><a href="/" style="color:var(--accent); text-decoration:none;">EUPHORIC</a></h1></header>
<section style="padding:50px 5%;">
  <h2 style="color:#e8dcc8; text-align:center; font-family:'Cormorant Garamond', serif; font-size: 3rem; margin-bottom: 40px;">Мастер-классы</h2>
  <div class="products">
  {% for w in workshops %}
    <div class="card" style="border:1px solid #333;">
      <div class="img">{% if w['image'] %}<img src="/static/uploads/{{ w['image'] }}">{% else %}🎓{% endif %}</div>
      <div style="padding:20px;">
        <h3 style="color:#e8dcc8;">{{ w['title'] }}</h3>
        <p style="color:#888; font-size:.9rem;">{{ w['description'] }}</p>
        {% if w['video'] %}
            <a href="{{ w['video'] }}" target="_blank" class="buy" style="margin-top:10px; display:inline-block; font-size: 0.8rem; padding: 10px 20px;">Смотреть видео</a>
        {% elif w['link'] %}
            <a href="{{ w['link'] }}" target="_blank" class="buy" style="margin-top:10px; display:inline-block; font-size: 0.8rem; padding: 10px 20px;">Открыть</a>
        {% endif %}
      </div>
    </div>
  {% endfor %}
  </div>
</section>
</body>
</html>
