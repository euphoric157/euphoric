<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — EUPHORIC</title>
<link rel="stylesheet" href="/static/style.css">
<style>
    .admin-block { background:#111; border: 1px solid #333; border-radius:16px; padding:24px; margin-bottom: 24px; }
    .admin-block h2 { color:#e8dcc8; font-family:'Cormorant Garamond', serif; margin-bottom:15px; }
    .admin-form input, .admin-form select, .admin-form textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px; }
    .admin-form button { background: #c9a96e; color: #000; padding: 12px 24px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
    .admin-row { border-bottom: 1px solid #222; padding: 15px 0; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-start; }
    .danger { background: #e74c3c !important; color: #fff !important; }
</style>
</head>
<body>
<header><h1>Админка EUPHORIC</h1><nav><a href="/admin/logout" style="color:#c9a96e;">Выйти</a></nav></header>
<div style="max-width:1000px; margin: 0 auto; padding: 24px;">

<section class="admin-block">
  <h2>⚙️ Настройки сайта</h2>
  <form action="/admin/settings" method="post" enctype="multipart/form-data" class="admin-form">
    <label style="color:#888;">Заголовок на главной:</label><input name="site_title" value="{{ site_settings.site_title }}">
    <label style="color:#888;">Цвет фона:</label><input name="bg_color" value="{{ site_settings.bg_color }}">
    <label style="color:#888;">Цвет акцента:</label><input name="accent_color" value="{{ site_settings.accent_color }}">
    <label style="color:#888;">Баннер:</label><input type="file" name="banner_image" accept="image/*">
    <button type="submit">Сохранить настройки</button>
  </form>
</section>

<section class="admin-block">
  <h2>➕ Добавить товар</h2>
  <form action="/admin/product/add" method="post" enctype="multipart/form-data" class="admin-form">
    <select name="category" required>
      <option value="bags">Сумки</option>
      <option value="boxes">Шкатулки</option>
      <option value="tops">Топы</option>
      <option value="shalstuki">Шалстуки (Аксессуары)</option>
      <option value="partupei">Партупеи (Аксессуары)</option>
      <option value="sumka-chehol">Сумка-чехол (Аксессуары)</option>
      <option value="vorotnik">Воротник (Аксессуары)</option>
      <option value="podsvetchnik">Подсвечник (Аксессуары)</option>
      <option value="korzina">Корзина (Аксессуары)</option>
      <option value="katholder">Катхолдер (Аксессуары)</option>
      <option value="obvesy">Обвесы (Аксессуары)</option>
      <option value="toys">Новогодние игрушки 🎄</option>
    </select>
    <input name="title" placeholder="Название" required>
    <textarea name="description" placeholder="Описание" rows="3"></textarea>
    <input name="price" type="number" placeholder="Цена, ₽" required>
    <input name="color" placeholder="Цвет изделия">
    <label style="color:#888;">Фотографии (можно несколько):</label>
    <input name="images" type="file" accept="image/*" multiple>
    <button type="submit">Добавить товар</button>
  </form>
</section>

<section class="admin-block">
  <h2>📦 Товары</h2>
  {% for p in products %}
  <div class="admin-row">
    <div style="flex:1;">
      <form action="/admin/product/{{ p['id'] }}/edit" method="post" class="admin-form">
        <select name="category">
          <option value="bags" {% if p['category']=='bags' %}selected{% endif %}>Сумки</option>
          <option value="boxes" {% if p['category']=='boxes' %}selected{% endif %}>Шкатулки</option>
          <option value="tops" {% if p['category']=='tops' %}selected{% endif %}>Топы</option>
          <option value="shalstuki" {% if p['category']=='shalstuki' %}selected{% endif %}>Шалстуки</option>
          <option value="partupei" {% if p['category']=='partupei' %}selected{% endif %}>Партупеи</option>
          <option value="sumka-chehol" {% if p['category']=='sumka-chehol' %}selected{% endif %}>Сумка-чехол</option>
          <option value="vorotnik" {% if p['category']=='vorotnik' %}selected{% endif %}>Воротник</option>
          <option value="podsvetchnik" {% if p['category']=='podsvetchnik' %}selected{% endif %}>Подсвечник</option>
          <option value="korzina" {% if p['category']=='korzina' %}selected{% endif %}>Корзина</option>
          <option value="katholder" {% if p['category']=='katholder' %}selected{% endif %}>Катхолдер</option>
          <option value="obvesy" {% if p['category']=='obvesy' %}selected{% endif %}>Обвесы</option>
          <option value="toys" {% if p['category']=='toys' %}selected{% endif %}>Игрушки</option>
        </select>
        <input name="title" value="{{ p['title'] }}">
        <textarea name="description" rows="2">{{ p['description'] }}</textarea>
        <input name="price" type="number" value="{{ p['price'] }}">
        <input name="color" value="{{ p['color'] }}" placeholder="Цвет">
        <button type="submit">Сохранить</button>
      </form>
    </div>
    <form action="/admin/product/{{ p['id'] }}/delete" method="post" onsubmit="return confirm('Удалить?')">
      <button class="danger" style="padding: 10px; width: auto;">Удалить</button>
    </form>
  </div>
  {% endfor %}
</section>
</div>
</body>
</html>
