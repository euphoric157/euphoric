<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка — EUPHORIC</title>
<link rel="stylesheet" href="/static/style.css"></head><body>
<header><h1>Админка EUPHORIC</h1><a href="/admin/logout" style="color:#b5651d;font-weight:600;">Выйти</a></header>

<div style="max-width:1000px;margin:0 auto;padding:24px;">

<section style="background:#fff;border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 4px 16px rgba(0,0,0,0.05);">
  <h2 style="margin-bottom:16px;">➕ Добавить товар</h2>
  <form action="/admin/product/add" method="post" enctype="multipart/form-data" style="display:flex;flex-direction:column;gap:10px;">
    <select name="category" required style="padding:10px;border:1px solid #ddd;border-radius:8px;">
      <option value="bags">Сумки</option>
      <option value="boxes">Шкатулки</option>
      <option value="toys">Новогодние игрушки</option>
    </select>
    <input name="title" placeholder="Название" required style="padding:10px;border:1px solid #ddd;border-radius:8px;">
    <textarea name="description" placeholder="Описание" rows="3" style="padding:10px;border:1px solid #ddd;border-radius:8px;"></textarea>
    <input name="price" type="number" placeholder="Цена, ₽" required style="padding:10px;border:1px solid #ddd;border-radius:8px;">
    <input name="image" type="file" accept="image/*">
    <button class="buy" style="border:none;cursor:pointer;">Добавить</button>
  </form>
</section>

<section style="background:#fff;border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 4px 16px rgba(0,0,0,0.05);">
  <h2 style="margin-bottom:16px;">📦 Товары ({{ products|length }})</h2>
  {% for p in products %}
  <div style="border-bottom:1px solid #eee;padding:16px 0;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">
    <div style="flex:1;min-width:250px;">
      <form action="/admin/product/{{ p['id'] }}/edit" method="post" style="display:flex;flex-direction:column;gap:8px;">
        <select name="category" style="padding:8px;border:1px solid #ddd;border-radius:6px;">
          <option value="bags" {% if p['category']=='bags' %}selected{% endif %}>Сумки</option>
          <option value="boxes" {% if p['category']=='boxes' %}selected{% endif %}>Шкатулки</option>
          <option value="toys" {% if p['category']=='toys' %}selected{% endif %}>Игрушки</option>
        </select>
        <input name="title" value="{{ p['title'] }}" style="padding:8px;border:1px solid #ddd;border-radius:6px;">
        <textarea name="description" rows="2" style="padding:8px;border:1px solid #ddd;border-radius:6px;">{{ p['description'] }}</textarea>
        <input name="price" type="number" value="{{ p['price'] }}" style="padding:8px;border:1px solid #ddd;border-radius:6px;">
        <button class="buy" style="border:none;cursor:pointer;font-size:.9rem;padding:8px;">Сохранить</button>
      </form>
    </div>
    <form action="/admin/product/{{ p['id'] }}/delete" method="post" onsubmit="return confirm('Удалить?')">
      <button style="background:#e74c3c;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">Удалить</button>
    </form>
  </div>
  {% else %}
  <p style="color:#888;">Товаров пока нет.</p>
  {% endfor %}
</section>

<section style="background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,0.05);">
  <h2 style="margin-bottom:16px;">🎓 Мастер-классы</h2>
  <form action="/admin/workshop/add" method="post" enctype="multipart/form-data" style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
    <input name="title" placeholder="Название" required style="padding:10px;border:1px solid #ddd;border-radius:8px;">
    <textarea name="description" placeholder="Описание" rows="2" style="padding:10px;border:1px solid #ddd;border-radius:8px;"></textarea>
