<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<title>Вход — EUPHORIC</title>
<link rel="stylesheet" href="/static/style.css"></head><body>
<div style="max-width:400px;margin:100px auto;padding:30px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08);">
  <h2 style="text-align:center;margin-bottom:20px;">Вход в админку</h2>
  {% if error %}<p style="color:#c00;text-align:center;margin-bottom:12px;">{{ error }}</p>{% endif %}
  <form method="post" style="display:flex;flex-direction:column;gap:12px;">
    <input type="password" name="password" placeholder="Пароль" required style="padding:12px;border:1px solid #ddd;border-radius:8px;">
    <button class="buy" style="border:none;cursor:pointer;">Войти</button>
  </form>
</div>
</body></html>
